name: HTML validation

on:
  pull_request:
    paths:
      - "**.html"
      - "**.css"
      - ".github/workflows/html-validate.yml"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"

permissions:
  contents: read

jobs:
  validate:
    name: html5validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          blacklist: versions
          format: text
