name: HTML validation

on:
  pull_request:
    paths:
      - "**.html"
      - "**.css"
      - "tests/**"
      - ".github/workflows/html-validate.yml"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    name: html5validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          blacklist: versions
          format: text
          css: true

  test:
    name: placemat tests (no build step, zero deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run structural/regression tests
        run: node tests/placemat.test.js
